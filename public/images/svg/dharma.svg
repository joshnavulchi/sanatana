<!-- scales_vector.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Style (edit these for color/thickness) -->
  <style>
    .gold-fill { fill:#D1A05B; }
    .gold-stroke { stroke:#8B6A3A; stroke-width:12; }
  </style>

  <!-- Geometry parameters (derived) -->
  <!-- Center -->
  <!-- cx = 512, cy = 512 -->

  <!-- Top finial -->
  <path class="gold-fill gold-stroke"
        d="M 512 232
           C 472 192, 502 152, 512 132
           C 522 152, 552 192, 512 232 Z"/>

  <!-- Horizontal arm (gentle curve) -->
  <path d="M 152 292
           C 352 242, 452 262, 512 292
           C 572 262, 672 242, 872 292"
        fill="none" class="gold-stroke"/>

  <!-- Arm body (fill under stroke) -->
  <path d="M 152 292
           C 352 242, 452 262, 512 292
           C 572 262, 672 242, 872 292"
        stroke="none" class="gold-fill" filter="url(#softShadow)"/>

  <!-- Hooks -->
  <path d="M 152 292 q -20 20, 0 40" fill="none" class="gold-stroke"/>
  <path d="M 872 292 q  20 20, 0 40" fill="none" class="gold-stroke"/>

  <!-- Chains -->
  <!-- Left -->
  <line x1="152" y1="332" x2="110" y2="512" class="gold-stroke" stroke-width="8"/>
  <line x1="152" y1="332" x2="194" y2="512" class="gold-stroke" stroke-width="8"/>
  <!-- Right -->
  <line x1="872" y1="332" x2="830" y2="512" class="gold-stroke" stroke-width="8"/>
  <line x1="872" y1="332" x2="914" y2="512" class="gold-stroke" stroke-width="8"/>

  <!-- Pans -->
  <ellipse cx="152" cy="542" rx="140" ry="48" class="gold-fill gold-stroke"/>
  <ellipse cx="872" cy="542" rx="140" ry="48" class="gold-fill gold-stroke"/>

  <!-- Central pillar -->
  <rect x="494" y="262" width="36" height="500" rx="18" ry="18" class="gold-fill gold-stroke"/>

  <!-- Decorative collar -->
  <rect x="452" y="272" width="120" height="36" rx="12" ry="12" class="gold-fill gold-stroke"/>

  <!-- Base -->
  <path d="M 372 762
           C 452 822, 572 822, 652 762
           L 652 792 L 372 792 Z"
        class="gold-fill gold-stroke"/>

  <!-- Soft shadows under pans -->
  <ellipse cx="152" cy="562" rx="133" ry="26" fill="rgba(0,0,0,0.18)"/>
  <ellipse cx="872" cy="562" rx="133" ry="26" fill="rgba(0,0,0,0.18)"/>
</svg>