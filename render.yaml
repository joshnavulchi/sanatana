services:
  - type: static_site
    name: sanatanadharmam.in
    env: node
    plan: free
    envVars:
      - key: NEXT_PUBLIC_GA_ID
        sync: false # Set to true if you want to sync from Render dashboard
        value: "${NEXT_PUBLIC_GA_ID}"
      - key: NEXT_PUBLIC_GTM_ID
        sync: false
        value: "${NEXT_PUBLIC_GTM_ID}"
      - key: NEXT_BUILD_MAX_WORKERS
        value: "4"
    installCommand: |
      npm install
    buildCommand: |
      export NODE_ENV=production
      export CI=true
      export NODE_OPTIONS=--max-old-space-size=6144

      echo "Fetching locales from remote branch..."
      fig fetch origin locales

      echo "Checking out locales directory from origin/locales..."
      git checkout origin/locales -- locales

      echo "Start build"
      npm run render-build
    publishPath: out

  - type: cron
    name: weekly-deploy
    env: node
    plan: free
    # Schedule: every Sunday 02:30 UTC == Sunday 08:00 IST (UTC+5:30)
    schedule: "30 2 * * 0"
    # Command triggers a deploy webhook. Set RENDER_DEPLOY_HOOK in Render env vars to your Deploy Hook URL.
    command:
      [
        "bash",
        "-lc",
        'if [ -n "$RENDER_DEPLOY_HOOK" ]; then curl -fsS -X POST "$RENDER_DEPLOY_HOOK" || echo ''deploy hook failed''; else echo ''RENDER_DEPLOY_HOOK not set; skipping deploy''; fi',
      ]
