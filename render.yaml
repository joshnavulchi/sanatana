services:
  - type: static_site
    name: sanatanadharmam.in
    env: node
    plan: free

    cache:
      - node_modules
      - .next/cache

    envVars:
      - key: NEXT_BUILD_MAX_WORKERS
        value: "4"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://sanatanadharmam.in"
      - key: NEXT_PUBLIC_SITE_NAME
        sync: false
      - key: NEXT_PUBLIC_SITE_DESCRIPTION
        sync: false
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      - key: NEXT_PUBLIC_GTM_ID
        sync: false

    installCommand: npm install

    buildCommand: |
      set -e

      export NODE_ENV=production
      export NODE_OPTIONS=--max-old-space-size=6144

      echo "== Environment variable check =="
      echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-NOT SET}"
      if [ -n "${NEXT_PUBLIC_GA_ID:-}" ]; then
        echo "NEXT_PUBLIC_GA_ID: found (${#NEXT_PUBLIC_GA_ID} chars)"
      else
        echo "NEXT_PUBLIC_GA_ID: NOT SET — Google Analytics will be disabled"
      fi
      if [ -n "${NEXT_PUBLIC_GTM_ID:-}" ]; then
        echo "NEXT_PUBLIC_GTM_ID: found (${#NEXT_PUBLIC_GTM_ID} chars)"
      else
        echo "NEXT_PUBLIC_GTM_ID: NOT SET — Google Tag Manager will be disabled"
      fi

      echo ">> Running Next build + export"
      npm run render-build   # MUST generate /out

      echo ">> Running post-build scripts"
      node scripts/generate-sitemap.js
      node scripts/minify-html.js
      node scripts/add-hash-to-assets.js
      node scripts/audit-seo.js --out out --json public/data/audit-report.json

    publishPath: out
