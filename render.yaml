services:
  - type: static_site
    name: sanatanadharmam.in
    env: node
    plan: free
    # Recommended: enable a persistent disk or build cache for `public/locales` in Render
    # so locale downloads are cached between builds. On Render dashboard:
    # 1. Open the service settings -> 'Disks' -> 'Create Persistent Disk'.
    # 2. Mount the disk to the service at path: /opt/render/project/src/public/locales
    # 3. Ensure the build command checks for the presence of that directory and skips
    #    full locale downloads when present (the app already detects cached locales).
    # Alternatively, configure a build cache or set the env var FORCE_LOCALE_DOWNLOAD=0
    # if you prefer to skip downloads when no cache is available.
    # Ensure devDependencies are installed during build so CLI tools (e.g. tailwindcss)
    # are available for the critical CSS generator. Set NPM_CONFIG_PRODUCTION=false
    # to prevent skipping devDependencies in CI environments.
    # Force locale download during static export and install devDependencies so CLI tools are available.
    buildCommand: export NPM_CONFIG_PRODUCTION=false && yarn install --immutable --immutable-cache && export FORCE_LOCALE_DOWNLOAD=1 && yarn render-build
    publishPath: out
  - type: cron
    name: weekly-deploy
    env: node
    plan: free
    # Schedule: every Sunday 02:30 UTC == Sunday 08:00 IST (UTC+5:30)
    schedule: "30 2 * * 0"
    # Command triggers a deploy webhook. Set RENDER_DEPLOY_HOOK in Render env vars to your Deploy Hook URL.
    command: ["bash", "-lc", "if [ -n \"$RENDER_DEPLOY_HOOK\" ]; then curl -fsS -X POST \"$RENDER_DEPLOY_HOOK\" || echo 'deploy hook failed'; else echo 'RENDER_DEPLOY_HOOK not set; skipping deploy'; fi"]
