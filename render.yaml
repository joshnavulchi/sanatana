services:
  - type: static_site
    name: sanatanadharmam.in
    env: node
    plan: free

    envVars:
      - key: NEXT_BUILD_MAX_WORKERS
        value: "4"

    installCommand: npm install

    buildCommand: |
      set -e

      export NODE_ENV=production
      export NODE_OPTIONS=--max-old-space-size=6144

      echo ">> Running Next build + export"
      npm run render-build   # MUST generate /out

      echo ">> Running post-build scripts"
      node scripts/generate-sitemap.js
      node scripts/minify-html.js
      node scripts/add-hash-to-assets.js
      node scripts/generate-post-deploy-audit.js
        node scripts/audit-seo.js --out out --json audit-report.json

    publishPath: out
