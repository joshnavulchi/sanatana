services:
  - type: static_site
    name: sanatanadharmam.in
    env: node
    plan: free
    envVars:
      - key: NEXT_BUILD_MAX_WORKERS
        value: "4"
    installCommand: |
      npm install
    buildCommand: |
      export NODE_ENV=production
      export NODE_OPTIONS=--max-old-space-size=6144      
      npm run render-build
      
    publishPath: out

  - type: cron
    name: weekly-deploy
    env: node
    plan: free
    schedule: "30 2 * * 0"
    command:
      [
        "bash",
        "-lc",
        'if [ -n "$RENDER_DEPLOY_HOOK" ]; then curl -fsS -X POST "$RENDER_DEPLOY_HOOK" || echo ''deploy hook failed''; else echo ''RENDER_DEPLOY_HOOK not set; skipping deploy''; fi',
      ]

services:
  - type: static
    name: your-static-site
    buildCommand: |
      set -euo pipefail

      # Initialize git if .git is missing (tarball checkout cases)
      if [ ! -d ".git" ]; then
        echo ">> Initializing git repo (tarball checkout detected)…"
        git init
      fi

      # Add 'origin' if missing
      if ! git remote get-url origin >/dev/null 2>&1; then
        if [ -z "${GIT_REMOTE_URL:-}" ]; then
          echo "ERROR: GIT_REMOTE_URL not set; cannot fetch locales branch."
          exit 1
        fi
        git remote add origin "${GIT_REMOTE_URL}"
      fi

      echo ">> Remotes:"
      git remote -v || true

      # Your original chain (make sync non-fatal initially)
      node scripts/compile-scss.js --force
      node scripts/generate-critical-css.js
      node scripts/compile-scss.js --verify
      node scripts/strip-comments.js
      node scripts/generate-sitemap.js
      node scripts/generate-post-deploy-audit.js
      node scripts/minify-html.js
      node scripts/add-hash-to-assets.js
      # analytics check removed
    publishPath: build
    envVars:
      - key: NODE_ENV
        value: production
      # Set this in the Render dashboard, ideally as a secret:
      # - key: GIT_REMOTE_URL
      #   sync: false  # set value in dashboard