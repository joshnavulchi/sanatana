<svg
  viewBox="0 0 1200 420"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Sanatana Dharma Cosmic Time Timeline">

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="22" font-weight="bold">
    Cosmic Time Cycle — Yuga, Manvantara, Kalpa
  </text>

  <!-- Yuga Section -->
  <text x="50" y="80" font-size="16" font-weight="bold">Chaturyuga</text>

  <!-- Satya Yuga -->
  <rect x="50" y="100" width="400" height="40" fill="#6ec1e4">
    <title>Satya Yuga — 1,728,000 years (Dharma 100%)</title>
  </rect>
  <text x="55" y="125" font-size="13">Satya Yuga</text>

  <!-- Treta Yuga -->
  <rect x="50" y="145" width="300" height="40" fill="#8fd18f">
    <title>Treta Yuga — 1,296,000 years (Dharma 75%)</title>
  </rect>
  <text x="55" y="170" font-size="13">Treta Yuga</text>

  <!-- Dvapara Yuga -->
  <rect x="50" y="190" width="200" height="40" fill="#f2c572">
    <title>Dvapara Yuga — 864,000 years (Dharma 50%)</title>
  </rect>
  <text x="55" y="215" font-size="13">Dvapara Yuga</text>

  <!-- Kali Yuga -->
  <rect x="50" y="235" width="100" height="40" fill="#e07a5f">
    <title>Kali Yuga — 432,000 years (Dharma 25%)</title>
  </rect>
  <text x="55" y="260" font-size="13">Kali Yuga</text>

  <!-- Divider -->
  <line x1="500" y1="80" x2="500" y2="300" stroke="#999" stroke-dasharray="4"/>

  <!-- Manvantara -->
  <text x="520" y="80" font-size="16" font-weight="bold">Manvantara</text>

  <rect x="520" y="120" width="420" height="60" fill="#b8bedd">
    <title>
      One Manvantara
      Duration: 306,720,000 years
      Contains: 71 Chaturyugas
      Current: 7th (Vaivasvata Manu)
    </title>
  </rect>

  <text x="530" y="155" font-size="14">
    1 Manvantara = 71 Chaturyugas
  </text>

  <!-- Kalpa -->
  <text x="520" y="220" font-size="16" font-weight="bold">Kalpa (Day of Brahma)</text>

  <rect x="520" y="245" width="600" height="70" fill="#d6ccc2">
    <title>
      One Kalpa (Day of Brahma)
      Duration: 4.32 billion years
      Contains: 14 Manvantaras
    </title>
  </rect>

  <text x="530" y="285" font-size="14">
    1 Kalpa = 14 Manvantaras (4.32 billion years)
  </text>

  <!-- Footer -->
  <text x="600" y="400" text-anchor="middle" font-size="12" fill="#555">
    Time is cyclical — moral order declines across Yugas, resets across Manvantaras
  </text>

</svg>