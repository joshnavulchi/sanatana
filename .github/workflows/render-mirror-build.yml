name: Render Mirror Build

on:
  pull_request:
    branches: [ development, main, production ]
  push:
    branches: [ production ]

jobs:
  render-mirror:
    name: Render Build (mirror)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Ensure Yarn (via Corepack)
        run: |
          corepack enable
          # Pin to the exact Yarn version used locally to avoid lockfile drift
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Run Render-like build: install
        env:
          NPM_CONFIG_PRODUCTION: false
        run: |
          echo "Running Render-like build: install dependencies"
          set -euo pipefail
          export NPM_CONFIG_PRODUCTION=false
          yarn install --frozen-lockfile

      - name: Restore critical CSS cache
        id: critical-cache
        uses: actions/cache@v4
        with:
          path: public/critical-home.css
          key: critical-home-css-${{ runner.os }}-${{ hashFiles('app/**') }}

      - name: Generate critical-home.css
        if: steps.critical-cache.outputs.cache-hit != 'true'
        run: |
          echo "Generating critical-home.css"
          node scripts/generate-critical-css.js || true

      - name: Use cached critical-home.css
        if: steps.critical-cache.outputs.cache-hit == 'true'
        run: |
          echo "Using restored public/critical-home.css"

      - name: Check critical CSS size
        run: |
          if [ -f public/critical-home.css ]; then
            size=$(wc -c < public/critical-home.css | tr -d '[:space:]') || size=0
            echo "Generated public/critical-home.css size=${size} bytes"
            if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ] && [ "${size:-0}" -gt 8192 ]; then
              echo "Critical CSS exceeds 8KB (${size} bytes) — failing build to avoid layout regressions"
              exit 1
            fi
          else
            echo "No public/critical-home.css generated; continuing"
          fi

      - name: Run render-build
        env:
          FORCE_LOCALE_DOWNLOAD: 1
        run: |
          export FORCE_LOCALE_DOWNLOAD=1
          yarn render-build

      - name: Upload static `out` artifact for debugging
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-out
          path: |
            out/**
            public/critical-home.css
