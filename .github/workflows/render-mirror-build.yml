name: Render Mirror Build

on:
  pull_request:
    branches: [development, production]
  push:
    branches: [production]

jobs:
  render-mirror:
    name: Render Build (mirror)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies with npm
        run: |
          set -e
          npm --version

      - name: Run Render-like build install
        env:
          NPM_CONFIG_PRODUCTION: 'false'
        run: |
          set -euo pipefail
          echo "Running Render-like build: install dependencies"
          npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'next.config.ts') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Restore critical CSS cache
        id: critical-cache
        uses: actions/cache@v4
        with:
          path: public/critical-home.css
          key: critical-home-css-${{ runner.os }}-${{ hashFiles('app/page.tsx', 'app/components/**') }}

      - name: Generate critical-home.css
        if: steps.critical-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "Generating critical-home.css"
          node scripts/generate-critical-css.js

      - name: Use cached critical-home.css
        if: steps.critical-cache.outputs.cache-hit == 'true'
        run: echo "Using cached public/critical-home.css"

      - name: Check critical CSS size
        run: |
          set -e
          if [ -f public/critical-home.css ]; then
            size=$(wc -c < public/critical-home.css | tr -d '[:space:]')
            echo "critical-home.css size=${size} bytes"

            if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ] && [ "$size" -gt 1024 ]; then
              echo "❌ Critical CSS exceeds 1 KB (${size} bytes)"
              exit 1
            fi
          else
            echo "⚠️ No critical-home.css found; continuing"
          fi

      - name: Download locales (incremental)
        continue-on-error: true
        run: |
          echo "Downloading only modified locales based on SHA comparison"
          node scripts/download-locales.js || echo "⚠️ Locale download failed, continuing with cached or partial locales"

      - name: Run render-build
        run: |
          set -e
          echo "Running render-build"
          npm run render-build

      - name: Upload static out artifact (debug)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-out
          path: |
            out/**
            public/critical-home.css
