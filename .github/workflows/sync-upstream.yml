name: Sync Upstream Branches

on:
  schedule:
    # Runs daily at 08:00, 13:00, 18:00 IST (02:30, 07:30, 12:30 UTC)
    - cron: '30 2 * * *'
    - cron: '30 7 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync all branches from upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate upstream repo variable
        run: |
          if [ -z "${{ vars.UPSTREAM_REPO }}" ]; then
            echo "::error::Repository variable UPSTREAM_REPO is not set. Please define it as 'owner/repo'."
            exit 1
          fi

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ vars.UPSTREAM_REPO }}.git || \
          git remote set-url upstream https://github.com/${{ vars.UPSTREAM_REPO }}.git

      - name: Fetch upstream + origin
        run: |
          git fetch --prune upstream
          git fetch --prune origin

      - name: Sync all upstream branches to fork (only if changed)
        run: |
          set -e
          failed_branches=()
          updated_branches=()

          for branch in $(git branch -r | grep 'upstream/' | grep -v 'HEAD' | sed 's|upstream/||'); do
            echo "Checking branch: $branch"

            upstream_sha="$(git rev-parse "upstream/$branch")"
            origin_ref="origin/$branch"

            if git show-ref --verify --quiet "refs/remotes/$origin_ref"; then
              origin_sha="$(git rev-parse "$origin_ref")"
            else
              origin_sha=""
            fi

            if [ "$upstream_sha" = "$origin_sha" ]; then
              echo "No changes for $branch (origin matches upstream). Skipping push."
              continue
            fi

            echo "Updating $branch (origin differs from upstream)."
            if git checkout -B "$branch" "upstream/$branch" && git push origin "$branch" --force; then
              echo "Successfully synced: $branch"
              updated_branches+=("$branch")
            else
              echo "::warning::Failed to sync branch: $branch"
              failed_branches+=("$branch")
            fi
          done

          if [ ${#updated_branches[@]} -gt 0 ]; then
            echo "Updated branches: ${updated_branches[*]}"
          else
            echo "No branches needed updates."
          fi

          if [ ${#failed_branches[@]} -gt 0 ]; then
            echo "::error::The following branches failed to sync: ${failed_branches[*]}"
            exit 1
          fi
