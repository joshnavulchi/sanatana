name: CI

on:
  pull_request:
    branches: [ development, main ]
  push:
    branches: [ development, main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Yarn (via Corepack)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version
      # Clean workspace: remove any existing `node_modules` and non-Yarn lockfiles
      # This avoids conflicts with Yarn Berry immutable installs in CI and prevents
      # stray lockfiles (package-lock.json, pnpm-lock.yaml, package.json.lock)
      # from interfering with `yarn install --immutable`.
      # We intentionally keep `yarn.lock` and Yarn config files so the install is deterministic.
      - name: Clean workspace (remove node_modules + non-Yarn lockfiles)
        run: |
          rm -rf node_modules
          rm -f package-lock.json pnpm-lock.yaml package.json.lock

      
      - name: Cache Yarn Berry cache
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock', 'next.config.ts') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Typecheck (tsc noEmit)
        run: yarn noEmit

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build
