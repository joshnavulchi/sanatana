name: Build and enforce googlebot meta

# Allow this workflow to also run after the gh-pages deploy workflow completes
permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_run:
    # Matches the workflow name in .github/workflows/gh-pages-deploy.yml
    workflows: ["Deploy to GitHub Pages (run after production build)"]
    types: [completed]

jobs:
  build-and-fix:
    # If triggered by a workflow_run only proceed when the upstream run succeeded
    if: ${{ github.event_name != 'workflow_run' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run googlebot fixer
        run: node scripts/fix-googlebot.js

      - name: Commit and push fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # If any deletions are staged, abort — do not allow automatic deletions.
          DELETIONS=$(git diff --cached --name-only --diff-filter=D | wc -l || true)
          if [ "${DELETIONS}" -ne "0" ]; then
            echo "Aborting: fixer would delete $DELETIONS file(s). Review changes manually." >&2
            git --no-pager diff --cached --name-status || true
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: enforce googlebot meta in generated pages"
            git push
          else
            echo "No changes to commit"
          fi
